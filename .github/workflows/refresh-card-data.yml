name: Refresh card data

# Scryfall publishes new bulk files around 21:00 UTC each day. This rebuilds the site's card data
# from them (scripts/card-data.ts) and deploys, so card pages, sitemaps and the quick view stay
# current without calling the Scryfall API.
# Off until the repo has the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the
# CARD_DATA_DEPLOY variable set to "true" (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.CARD_DATA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # the script is TypeScript, which Node runs directly from 22.18 on
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run build
      - run: npm run card-data
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
