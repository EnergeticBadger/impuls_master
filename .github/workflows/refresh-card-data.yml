name: Refresh card data

# Scryfall publishes new bulk files around 21:00 UTC each day. This rebuilds the site's card data from them
# (scripts/card-data.ts) and uploads it to the R2 bucket the site reads it from (scripts/upload-card-data.sh).
# It doesn't deploy: the card data lives apart from the deploy, so a deploy can't take it away and new card
# data goes live without one.
# Off until the repo has the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and CLOUDFLARE_ACCOUNT_ID secrets and the
# CARD_DATA_DEPLOY variable set to "true" (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: card-data
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.CARD_DATA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the script is TypeScript, which Node runs directly from 22.18 on
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run card-data
      # the AWS CLI comes with GitHub's Ubuntu runners
      - run: npm run card-data:upload
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
